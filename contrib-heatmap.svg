name: Update contribution graph

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Render animated contribution graph
        run: python scripts/generate_streak_svg.py JerryX2007 contrib-heatmap.svg

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg
          if git diff --cached --quiet; then
            echo "Contribution graph is already current."
            exit 0
          fi
          git commit -m "chore: refresh contribution graph [skip ci]"
          git push
