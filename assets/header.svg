<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Jerry Xing — Computer Science at University of Toronto Scarborough">
<style>
text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.type{clip-path:inset(0 100% 0 0);animation:type 1.1s steps(6) .3s forwards}
@keyframes type{to{clip-path:inset(0 0 0 0)}}
.caret{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.up{opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.type,.up{animation:none;opacity:1;clip-path:none}}
</style>
<rect x=".5" y=".5" width="999" height="229" rx="12" fill="#010409" stroke="#30363d"/>
<circle cx="28" cy="26" r="5" fill="#30363d"/><circle cx="46" cy="26" r="5" fill="#30363d"/><circle cx="64" cy="26" r="5" fill="#30363d"/>
<text x="40" y="84" font-size="17" fill="#9198a1"><tspan fill="#3fb950">jerry@toronto</tspan>:<tspan fill="#79c0ff">~</tspan>$ </text>
<text class="type" x="216" y="84" font-size="17" fill="#e6edf3">whoami</text>
<text class="caret" x="284" y="84" font-size="17" fill="#3fb950">▍</text>
<g class="up" style="animation-delay:1.5s"><text x="38" y="158" font-size="64" font-weight="800" letter-spacing="-2" fill="#e6edf3">Jerry Xing<tspan fill="#3fb950">.</tspan></text></g>
<g class="up" style="animation-delay:1.8s"><text x="40" y="198" font-size="16" fill="#9198a1">CS @ University of Toronto Scarborough  ·  full-stack · backend · APIs · databases</text></g>
</svg>